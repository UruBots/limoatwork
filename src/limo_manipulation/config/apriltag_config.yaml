# ── Detector settings ──
detector:
  tag_family:              "36h11"
  decimate_factor:         2.0
  blur:                    0.0
  threads:                 2
  max_hamming_distance:    0
  refine_edges:            true

# ── Pose estimation settings ──
pose:
  min_decision_margin:     20.0
  max_detection_distance:  1.2
  min_tag_area_px:         100

# ── Camera topics ──
camera:
  image_topic:   "/camera/image_raw"
  info_topic:    "/camera/camera_info"
  frame_id:      "camera_color_optical_frame"
  target_frame:  "map"
