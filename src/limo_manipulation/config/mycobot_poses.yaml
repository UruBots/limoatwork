# mycobot_poses.yaml
# Named joint configurations for MyCobot 280 on LIMO.
# Joints: [j1, j2, j3, j4, j5, j6] (all in radians)
#
# MyCobot 280 is a 6-DOF serial manipulator:
#   j1 = base rotation
#   j2 = shoulder
#   j3 = elbow
#   j4 = wrist pitch
#   j5 = wrist roll
#   j6 = end-effector rotation
#
# URDF joint names (from mycobot_280_arduino.urdf):
#   joint2_to_joint1, joint3_to_joint2, joint4_to_joint3,
#   joint5_to_joint4, joint6_to_joint5, joint6output_to_joint6
#
# !! These are approximate starting values — tune on your hardware !!

joint_names:
  - joint2_to_joint1
  - joint3_to_joint2
  - joint4_to_joint3
  - joint5_to_joint4
  - joint6_to_joint5
  - joint6output_to_joint6

gripper_joint_names:
  - gripper_joint

poses:
  # Safe home/transport — arm folded up and back
  home:        [0.0, -0.5,  1.2, -0.7, 0.0, 0.0]

  # Scan pose — looking down at the table
  scan:        [0.0,  0.3, -0.3, -0.5, -1.57, 0.0]

  # Pre-grasp — hovering above the table
  pre_grasp:   [0.0,  0.6,  0.2, -0.9, -1.57, 0.0]

  # Grasp — end-effector at table surface
  grasp:       [0.0,  0.8,  0.4, -1.2, -1.57, 0.0]

  # Carry — object held safely above obstacles
  carry:       [0.0, -0.3,  0.8, -0.5, -1.57, 0.0]

  # Place ready — hovering above delivery zone
  place_ready: [0.0,  0.4, -0.1, -0.7, -1.57, 0.0]

  # Shelf pick — extended low reach under top shelf
  shelf_pick:  [0.0,  0.9,  0.5, -1.4, -1.57, 0.0]

  # Shelf place — reach to upper shelf level
  shelf_place: [0.0,  0.2, -0.6, -0.3, -1.57, 0.0]

  # ── Height-variant poses ──────────────────────────────────────────
  # Default pre_grasp/grasp above are calibrated for 10cm tables.
  # Variants below adjust j2 (shoulder) and j3 (elbow) to reach
  # different table heights.  Lower tables → j2/j3 more positive.

  # 0cm table (floor level, z=0.00m — deepest reach)
  pre_grasp_00cm: [0.0,  0.9,  0.5, -1.2, -1.57, 0.0]
  grasp_00cm:     [0.0,  1.1,  0.7, -1.5, -1.57, 0.0]
  scan_00cm:      [0.0,  0.5, -0.1, -0.7, -1.57, 0.0]

  # 5cm table (z=0.05m — slightly lower than default)
  pre_grasp_05cm: [0.0,  0.7,  0.3, -1.0, -1.57, 0.0]
  grasp_05cm:     [0.0,  0.9,  0.5, -1.3, -1.57, 0.0]

  # 15cm table (z=0.15m — slightly higher than default)
  pre_grasp_15cm: [0.0,  0.5,  0.1, -0.8, -1.57, 0.0]
  grasp_15cm:     [0.0,  0.7,  0.3, -1.1, -1.57, 0.0]

  # ── Special service-area poses ────────────────────────────────────

  # Container: lower into container (slightly below table surface)
  container_place: [0.0,  0.85,  0.45, -1.25, -1.57, 0.0]

  # Rotating table: careful extended approach
  rt_pre_grasp: [0.0,  0.55,  0.1, -0.85, -1.57, 0.0]
  # Rotating table: quick steady grasp
  rt_grasp:     [0.0,  0.75,  0.35, -1.15, -1.57, 0.0]

  # Precision placement: careful controlled descent
  pp_place:    [0.0,  0.7,  0.3, -1.05, -1.57, 0.0]

# Gripper positions (pymycobot: 0=fully open, 100=fully closed)
# ros2_control: joint position in radians
gripper:
  open:    0.0
  close:   1.4
  partial: 0.7

# Gripper values for pymycobot direct mode (0-100 scale)
gripper_pymycobot:
  open:    0
  close:   100
  partial: 50

timing:
  joint_move_duration:   3.0    # seconds per waypoint (6-DOF is slower)
  gripper_move_duration: 1.5
  settle_wait:           1.0
  pymycobot_speed:       40     # speed parameter for send_angles (0-100)
