# apriltag_config.yaml
# AprilTag 36h11 definitions for ALL RoboCup @Work objects.
#
# Tag IDs match the AtWork Commander object IDs so that an ATTC cube
# with tag ID N represents object N.  Additional workstation markers
# use IDs >= 100.
#
# tag_size:  physical size of the DATA AREA (outer black border included),
#            in metres.  Used for PnP pose estimation.
#
# tag_to_object_offset:  [x, y, z] metres from tag face centre to the
#            object's grasp centre (tag frame).  z > 0 = above tag surface.

tag_family: "36h11"

tags:

