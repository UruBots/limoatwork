# apriltag_config.yaml
# AprilTag 36h11 definitions for RoboCup @Work objects.
#
# Each tag is printed/attached on a specific @Work object so the robot can:
#   1. Detect the object type from the tag ID.
#   2. Estimate the tag's 3D pose from the camera image.
#   3. Use the known offset (tag_to_object_offset) to compute the object's
#      grasp centre in the camera frame.
#
# tag_size: the physical size of the tag's DATA AREA (outer black border
#           included), in metres.  This is used for PnP pose estimation.
#
# tag_to_object_offset: [x, y, z] metres from the tag face centre to the
#                        object's grasp centre (in the tag's own frame).
#                        z > 0 means "above the tag surface".
#
# !! RoboCup @Work competition uses the 36h11 family !!
# Generate PNG files with:
#   ros2 run limo_manipulation generate_apriltags.py
# (or use the pre-generated files in atwork_arena_description/materials/textures/)

tag_family: "36h11"

tags:
  - id: 0
    size: 0.036                  # 36 mm tag (fits on 42 mm cube face with border)
    object_type: attc_cube
    description: "ATTC Cube (AprilTag Target Cube) — top/front face"
    tag_to_object_offset: [0.0, 0.0, 0.021]   # cube half-height above tag centre

  - id: 1
    size: 0.018                  # 18 mm sticker tag on F20_20 profile
    object_type: f20_20
    description: "F20×20 Aluminium Profile — tag on side face"
    tag_to_object_offset: [0.0, 0.0, 0.010]   # half-width into profile

  - id: 2
    size: 0.035                  # 35 mm tag on S40_40 profile (fits on 40 mm face)
    object_type: s40_40
    description: "S40×40 Aluminium Profile — tag on side face"
    tag_to_object_offset: [0.0, 0.0, 0.020]

  - id: 3
    size: 0.025                  # 25 mm tag for M20 nut (placed on table next to it)
    object_type: nut_m20
    description: "M20 Hex Nut — tag on reference card placed next to nut"
    tag_to_object_offset: [0.0, 0.0, 0.008]   # nut half-height

  - id: 4
    size: 0.100                  # 100 mm workstation marker (larger for long-range)
    object_type: workstation_marker
    description: "Workstation 01 identification marker"
    tag_to_object_offset: [0.0, 0.0, 0.0]

  - id: 5
    size: 0.100
    object_type: workstation_marker
    description: "Workstation 02 identification marker"
    tag_to_object_offset: [0.0, 0.0, 0.0]

# ---- Detector settings (passed to apriltag_detector node) ----
detector:
  tag_family:              "36h11"
  decimate_factor:         2.0    # reduce resolution for speed (1.0 = no decimation)
  blur:                    0.0    # gaussian blur before detection
  threads:                 2
  max_hamming_distance:    0      # 0 = exact match only (more reliable)
  refine_edges:            true

# ---- Pose estimation settings ----
pose:
  # Minimum tag decision margin to accept a detection as valid
  min_decision_margin:     20.0
  # Maximum allowed distance for valid detection (metres, in camera frame)
  max_detection_distance:  1.2
  # Minimum tag pixel area to accept (filters distant/blurry detections)
  min_tag_area_px:         100

# ---- Camera topics ----
camera:
  image_topic:   "/camera/image_raw"
  info_topic:    "/camera/camera_info"
  frame_id:      "camera_color_optical_frame"
  target_frame:  "map"
