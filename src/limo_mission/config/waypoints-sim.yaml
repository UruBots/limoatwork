frame_id: map

waypoints:
  # WS01 table: world (2.15,-0.35) yaw=-0.66 rad, size 0.5×0.8 m.
  # Front barrier has NO collision → robot can approach to 0.44 m from table center:
  #   table half_x (0.25) + robot half-length (0.16) + safety (0.03) = 0.44 m
  # Arm tip (grasp reach 0.302 m) lands at local_x=0.138 m inside the table front half.
  WS01:
    x: 2.498
    y: -0.620
    yaw: 2.482

  # WS02 table: world (1.85,1.20) yaw=0.30 rad, size 0.5×0.8 m. Same geometry.
  WS02:
    x: 2.270
    y: 1.330
    yaw: -2.842

  START:
    x: 0.0
    y: 0.0
    yaw: 0.0

# Waypoints that are delivery zones: arriving here triggers PLACE (not pick).
# Workstations NOT in this list trigger PICK on arrival.
delivery_zones: [START]

routes:
  # Competition mission:
  #   WS01 → pick → START → place → WS02 → pick → START → place
  full_mission:    [WS01, START, WS02, START]

  # Legacy / debug routes
  test_route:      [WS01, WS02]
  back_to_start:   [WS01, WS02, START]
  pick_ws01:       [WS01]
  pick_and_return: [WS01, START]
