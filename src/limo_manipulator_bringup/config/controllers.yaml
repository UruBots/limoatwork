controller_manager:
  ros__parameters:
    # 50 Hz matches the gz_ros2_control simulation period (0.01 s warning threshold).
    # 100 Hz was causing the "update period slower than sim period" warning and
    # doubling the controller compute overhead.
    update_rate: 50 # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    # Publish at 30 Hz instead of the controller_manager rate (50 Hz).
    # This reduces the /joint_states topic overhead by 40% with no loss for Nav2.
    publish_rate: 30.0

arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4

gripper_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - gripper_left_joint
