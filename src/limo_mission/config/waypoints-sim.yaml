frame_id: map

waypoints:
  # WS01 table is at (2.15, -0.35) yaw=-0.66 rad in atwork_2024.world.
  # Robot is positioned 0.35 m in front of the table face so the arm
  # (extending forward from base_link) aligns with the table surface.
  # robot_pos = table_pos + table_front_dir * 0.35 = (2.43, -0.56)
  # robot_yaw = atan2(-sin(-0.66), -cos(-0.66)) = 2.48 rad (facing back to table)
  WS01:
    x: 2.43
    y: -0.56
    yaw: 2.48

  # WS02 table is at (1.85, 1.20) yaw=0.30 rad in atwork_2024.world.
  # Robot positioned 0.35 m in front of the table face.
  # robot_pos = (2.18, 1.30), robot_yaw = -2.84 rad (facing back to table)
  WS02:
    x: 2.18
    y: 1.30
    yaw: -2.84

  START:
    x: 0.0
    y: 0.0
    yaw: 0.0

routes:
  test_route:      [WS01, WS02]
  back_to_start:   [WS01, WS02, START]
  # Pick at WS01 only, stay there; place triggered after route ends
  pick_ws01:       [WS01]
  # Pick at WS01 → navigate back to START → place triggered after route ends
  pick_and_return: [WS01, START]
